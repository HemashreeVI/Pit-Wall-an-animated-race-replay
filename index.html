<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pit Wall</title>
  <meta name="description" content="Replay real Formula 1 races from OpenF1 GPS data: live track map, animated leaderboard, tyre strategy and head-to-head.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0A0F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E10600'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- cinematic intro -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-stripes"></div>
    <svg class="intro-car" viewBox="0 0 520 120" aria-hidden="true">
      <defs>
        <linearGradient id="carBody" x1="0" x2="1">
          <stop offset="0" stop-color="#7a0300"/><stop offset=".55" stop-color="#E10600"/><stop offset="1" stop-color="#ff4a3d"/>
        </linearGradient>
      </defs>
      <g class="speed-lines" stroke="#E10600" stroke-linecap="round">
        <line x1="-260" y1="44" x2="-20" y2="44" stroke-width="3" opacity=".6"/>
        <line x1="-320" y1="66" x2="-40" y2="66" stroke-width="2" opacity=".4"/>
        <line x1="-220" y1="86" x2="0" y2="86" stroke-width="3" opacity=".5"/>
      </g>
      <!-- rear wing -->
      <rect x="18" y="26" width="16" height="44" rx="3" fill="#1b1b22"/>
      <rect x="8" y="22" width="46" height="10" rx="3" fill="url(#carBody)"/>
      <!-- body -->
      <path d="M40 74 C60 58 120 52 180 52 L250 50 C280 40 320 40 350 50 L440 62 C470 66 500 72 512 82 L512 88 L40 88 Z" fill="url(#carBody)"/>
      <path d="M232 50 C250 30 300 28 318 46 L300 52 L246 52 Z" fill="#111" opacity=".85"/>
      <path d="M260 44 h44" stroke="#F5B841" stroke-width="3" stroke-linecap="round"/>
      <path d="M120 70 L420 70" stroke="#fff" stroke-width="2" opacity=".35"/>
      <!-- front wing -->
      <rect x="460" y="86" width="58" height="8" rx="3" fill="#1b1b22"/>
      <!-- wheels -->
      <g class="wheel"><circle cx="96" cy="88" r="26" fill="#0d0d10"/><circle cx="96" cy="88" r="12" fill="#2a2a33"/><path d="M96 66 v8 M96 102 v8 M74 88 h8 M110 88 h8" stroke="#E10600" stroke-width="3"/></g>
      <g class="wheel"><circle cx="418" cy="90" r="22" fill="#0d0d10"/><circle cx="418" cy="90" r="10" fill="#2a2a33"/><path d="M418 72 v7 M418 101 v7 M400 90 h7 M429 90 h7" stroke="#E10600" stroke-width="3"/></g>
    </svg>
    <div class="lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="intro-title"><span>PIT</span> WALL</div>
    <button class="intro-skip" type="button">Skip intro ⏭</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name"><b>PIT</b> WALL</span>
    </div>
    <div class="race-title">
      <h1 id="raceName">Loading…</h1>
      <span id="raceSub" class="race-sub"></span>
      <span id="demoBadge" class="badge demo" hidden title="Fictional drivers, teams and circuit generated by generate_demo.py">DEMO DATA</span>
    </div>
    <label class="picker">
      <span class="sr-only">Race</span>
      <select id="racePicker" aria-label="Choose a race"></select>
    </label>
  </header>

  <main class="wall">
    <section class="panel map-panel" aria-label="Track map">
      <div class="panel-head">
        <div class="lap-box"><span class="label">LAP</span> <b id="lapNow">–</b><span class="muted">/<span id="lapTotal">–</span></span></div>
        <div class="clock" id="clock">00:00</div>
        <div id="flag" class="flag" hidden></div>
      </div>
      <div class="map-wrap">
        <canvas id="trackCanvas" aria-label="Animated track map with every car"></canvas>
        <div id="pitToast" class="pit-toast" aria-live="polite"></div>
      </div>
      <div class="controls" role="group" aria-label="Replay controls">
        <button id="playBtn" class="btn play" type="button" aria-label="Play">▶</button>
        <button id="back10" class="btn small" type="button" title="Back 10 s (←)">-10s</button>
        <button id="fwd10" class="btn small" type="button" title="Forward 10 s (→)">+10s</button>
        <input id="scrub" type="range" min="0" max="1" step="0.1" value="0" aria-label="Race time">
        <div class="speeds" role="radiogroup" aria-label="Playback speed">
          <button class="btn chip" data-speed="1" type="button">1×</button>
          <button class="btn chip" data-speed="2" type="button">2×</button>
          <button class="btn chip" data-speed="5" type="button">5×</button>
          <button class="btn chip" data-speed="10" type="button">10×</button>
          <button class="btn chip" data-speed="30" type="button" title="Fast-forward">30×</button>
        </div>
      </div>
    </section>

    <section class="panel board-panel" aria-label="Leaderboard">
      <div class="panel-head">
        <h2>Leaderboard</h2>
        <span class="muted small">Gap to leader · click a driver</span>
      </div>
      <div id="leaderboard" class="leaderboard"></div>
    </section>

    <section class="panel lower-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="tyres" type="button">🛞 Tyre strategy</button>
        <button class="tab" role="tab" data-tab="h2h" type="button">⚔️ Head-to-head</button>
      </div>
      <div class="tab-body" data-body="tyres">
        <div class="legend" id="tyreLegend"></div>
        <canvas id="tyreCanvas" aria-label="Tyre strategy chart"></canvas>
      </div>
      <div class="tab-body" data-body="h2h" hidden>
        <div class="h2h-pick">
          <select id="h2hA" aria-label="First driver"></select>
          <span class="vs">VS</span>
          <select id="h2hB" aria-label="Second driver"></select>
        </div>
        <div id="h2hSummary" class="h2h-summary"></div>
        <canvas id="h2hCanvas" aria-label="Head-to-head lap times and gap"></canvas>
      </div>
    </section>
  </main>

  <!-- driver card -->
  <div id="driverCard" class="card-backdrop" hidden>
    <div class="driver-card" role="dialog" aria-modal="true" aria-labelledby="dcName">
      <button class="close" type="button" aria-label="Close">✕</button>
      <div class="dc-top">
        <div class="dc-photo" id="dcPhoto"></div>
        <div>
          <div class="dc-number" id="dcNumber"></div>
          <h3 id="dcName"></h3>
          <div class="dc-team" id="dcTeam"></div>
        </div>
      </div>
      <div class="dc-stats" id="dcStats"></div>
      <canvas id="dcChart" aria-label="Lap time chart"></canvas>
    </div>
  </div>

  <footer class="foot">
    Data: <a href="https://openf1.org" target="_blank" rel="noopener">OpenF1</a> ·
    Unofficial fan project, not associated with Formula 1, the FIA or any team ·
    <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek · <kbd>1</kbd>–<kbd>5</kbd> speed
  </footer>

  <script src="js/data.js"></script>
  <script src="js/replay.js"></script>
  <script src="js/trackmap.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/tyres.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
